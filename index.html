<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Portfolio Abed.Allah</title>
  <meta name="description" content="Digital Creator • Designer • Artist — all my links in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- ============ BACKGROUND ============ -->
  <div class="bg" style="--bg-image: url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?q=80&w=1600&auto=format&fit=crop');"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>

  <!-- ============ MAIN CARD ============ -->
  <main class="card" role="main">

    <!-- Share button -->
    <button class="share-btn" id="shareBtn" type="button" aria-label="Share this profile">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
        <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
      </svg>
    </button>

    <!-- ============ PROFILE ============ -->
    <section class="profile" aria-label="Profile">
      <div class="avatar-wrap fade-in" style="--delay: 0s">
        <div class="avatar-glow" aria-hidden="true"></div>
        <img
          class="avatar"
          src="assets/img/photo_profile.jpg"
          alt="Your Name profile picture"
          width="100"
          height="100"
        >
      </div>

      <h1 class="name fade-in" style="--delay: 0.1s">Abed.Allah</h1>
      <p class="bio fade-in" style="--delay: 0.2s">Digital Creator • Designer • Artist</p>
      <p class="description fade-in" style="--delay: 0.3s">Creating ideas, designs &amp; digital experiences.</p>
    </section>

    <!-- ============ LINK BUTTONS ============ -->
    <nav class="links" aria-label="Main links">

      <a class="link-btn fade-in" style="--delay: 0.4s" href="https://example.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">🌐</span>
        <span class="link-text">Official Website</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-btn fade-in" style="--delay: 0.48s" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true"></span>
        <span class="link-text">Instagram</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-btn fade-in" style="--delay: 0.56s" href="https://tiktok.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">🎵</span>
        <span class="link-text">TikTok</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-btn fade-in" style="--delay: 0.64s" href="https://youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">▶</span>
        <span class="link-text">YouTube</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-btn fade-in" style="--delay: 0.72s" href="https://wa.me/" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">💬</span>
        <span class="link-text">WhatsApp</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-btn fade-in" style="--delay: 0.8s" href="mailto:example@email.com">
        <span class="link-icon" aria-hidden="true">📧</span>
        <span class="link-text">Contact Me</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

    </nav>

    <!-- ============ SOCIAL ICONS ============ -->

        <span class="tooltip">Instagram</span>
      </a>

      <a class="social-btn" href="https://tiktok.com/" target="_blank" rel="noopener noreferrer" aria-label="TikTok" data-tooltip="TikTok">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.6 2h-3.3v13.9c0 1.6-1.3 2.9-2.9 2.9a2.9 2.9 0 0 1-2.9-2.9c0-1.6 1.3-2.9 2.9-2.9.3 0 .6.05.9.13v-3.35a6.2 6.2 0 0 0-.9-.07 6.24 6.24 0 1 0 6.24 6.24V8.7a7.9 7.9 0 0 0 4.6 1.47V6.85a4.6 4.6 0 0 1-4.6-4.6V2Z"/></svg>

        <span class="tooltip">YouTube</span>
      </a>

      <a class="social-btn" href="https://facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" data-tooltip="Facebook">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13.5 22v-8.4h2.83l.42-3.28h-3.25V8.2c0-.95.26-1.6 1.63-1.6h1.74V3.67c-.3-.04-1.33-.13-2.53-.13-2.5 0-4.22 1.53-4.22 4.34v2.42H7.3v3.28h2.82V22h3.38Z"/></svg>
        <span class="tooltip">Facebook</span>
      </a>

      <a class="social-btn" href="https://wa.me/" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" data-tooltip="WhatsApp">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.33 4.95L2.05 22l5.27-1.38a9.9 9.9 0 0 0 4.72 1.2h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.02c-.24.68-1.4 1.32-1.93 1.4-.49.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.94s.73-2.09.99-2.37c.24-.27.53-.34.71-.34.18 0 .35 0 .5.01.16.01.38-.06.6.46.24.56.8 1.96.87 2.1.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.27.14.43.12.59-.07.16-.19.68-.79.86-1.06.18-.27.35-.22.6-.13.24.09 1.53.72 1.79.85.27.14.44.2.5.32.07.12.07.68-.17 1.35Z"/></svg>
        <span class="tooltip">WhatsApp</span>
      </a>

    </div>

    <!-- ============ FOOTER ============ -->
    <footer class="footer fade-in" style="--delay: 1s">
      <p>&copy; 2026 Your Name</p>
      <p class="made-with">Made with ❤️</p>
    </footer>

  </main>

  <!-- Toast for copy-link feedback -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/script.js"></script>
</body>
</html>
